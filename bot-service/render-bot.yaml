services:
  - type: worker
    name: pythontutor-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEB_API_URL
        value: https://pythontutor-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
