<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Admin - Python Tutor Bot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="user-profile">
            <div class="user-avatar">
                {{ current_user.username[0]|upper }}
            </div>
            <div class="user-info">
                <h3>{{ current_user.username }}</h3>
                <p>Administrador</p>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <div class="sidebar-nav-section">
                <div class="sidebar-nav-title">Panel</div>
                <a href="{{ url_for('dashboard') }}" class="sidebar-nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <span class="sidebar-nav-icon">📊</span>
                    Dashboard
                </a>
            </div>
            
            <div class="sidebar-nav-section">
                <div class="sidebar-nav-title">Cuenta</div>
                <a href="/admin/logout" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon">�</span>
                    Cerrar Sesión
                </a>
            </div>
            
            <a href="{{ url_for('logout') }}" class="logout-btn">
                <span>🚪</span>
                Cerrar Sesión
            </a>
        </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-container">
            {% block admin_content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Mobile Menu Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<!-- Mobile Menu Toggle -->
<button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
