{% extends "login_base.html" %}

{% block title %}Pagina no encontrada - Python Tutor Bot{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="error-code">404</div>
                <h2 class="fw-bold mb-3">Pagina no encontrada</h2>
                <p class="mb-4">
                    La pagina que buscas no existe, fue movida o nunca estuvo aqui.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-house me-2"></i>Ir al Inicio
                    </a>
                    <a href="{{ url_for('features') }}" class="btn btn-outline-light btn-lg px-4">
                        <i class="bi bi-compass me-2"></i>Explorar
                    </a>
                </div>
                <div class="mt-4">
                    <small style="color:rgba(255,255,255,0.4);">
                        <i class="bi bi-arrow-left me-1"></i>
                        <a href="javascript:history.back()" style="color:rgba(255,255,255,0.5);">Volver a la pagina anterior</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
