{% extends "login_base.html" %}

{% block title %}Acceso Admin - Python Tutor Bot{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh;">
        <div class="col-md-10 col-lg-5">
            <div class="text-center mb-4">
                <a href="{{ url_for('index') }}" class="text-white text-decoration-none d-inline-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-terminal-fill fs-2"></i>
                    <span class="fs-4 fw-bold">Python Tutor Bot</span>
                </a>
            </div>
            <div class="card shadow-xl border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 mb-3" style="width:64px;height:64px;">
                            <i class="bi bi-shield-lock fs-3 text-primary"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Panel de Administracion</h3>
                        <p class="text-muted small mb-0">Ingresa tus credenciales para acceder al panel de control.</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Tu usuario" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Tu contraseña" required>
                                <button type="button" class="btn btn-outline-secondary border-start-0 pwd-toggle" data-toggle-password="password" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Volver al sitio
                        </a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">
                    <i class="bi bi-circle-fill me-1" style="font-size:0.4rem;"></i>Sistema Operativo
                </span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
