{% extends "admin_base.html" %}

{% block title %}Panel de Administración{% endblock %}

{% block admin_content %}
            <div class="admin-header">
                <h1>Panel de Administración</h1>
                <p>Bienvenido de nuevo, {{ current_user.username }}. Aquí tienes un resumen del sistema.</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card modern-stat users-stat">
                    <div class="stat-icon-wrapper">
                        <div class="stat-icon">👥</div>
                    </div>
                    <div class="stat-content">
                        <h3>Usuarios Totales</h3>
                        <p class="stat-number" data-target="{{ total_users }}">0</p>
                        <div class="stat-indicator positive">
                            <span class="indicator-arrow">↑</span>
                            <span class="indicator-text">Activos</span>
                        </div>
                    </div>
                    <div class="stat-bg-effect"></div>
                </div>
            </div>
        </div>
{% endblock %}
